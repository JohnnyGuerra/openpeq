[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpeq"
version = "0.2.0"
description = "Universal Hardware DSP Flasher & Web Equalizer for Portable USB-C DACs and IEMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Pair Programmer" }
]
keywords = [
    "openpeq",
    "dsp",
    "peq",
    "parametric-eq",
    "ktmicro",
    "kt02h20",
    "walkplay",
    "crinear",
    "kiwi-ears",
    "allegro-mini",
    "fiio-ja11",
    "moondrop-freedsp",
    "autoeq",
    "iem",
    "audiophile",
    "audio"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "hidapi>=0.14.0"
]

[project.scripts]
openpeq = "dac_peq.cli:main"
dac-peq = "dac_peq.cli:main"
dac-peq-manager = "dac_peq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dac_peq = ["data/*.json", "data/presets/*.json", "data/presets/targets/*.json"]

