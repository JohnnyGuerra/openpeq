name: Track Growth & Traffic Archive

on:
  schedule:
    # Run once daily at 00:00 UTC to capture daily traffic before GitHub's 14-day cutoff
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab or gh CLI

permissions:
  contents: write

jobs:
  track-growth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and archive growth metrics
        env:
          # Use METRICS_TOKEN if configured as a secret (required for traffic API access in Actions),
          # falling back to GITHUB_TOKEN
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/track_growth.py

      - name: Commit and push metrics updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --staged --quiet; then
            echo "No changes in metrics, skipping commit."
          else
            git commit -m "chore(metrics): archive daily growth and traffic data [skip ci]"
            git push
          fi
