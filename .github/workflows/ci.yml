name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev

      - name: Set up Node.js (web harness tests execute the web modules in Node)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest typer rich hidapi

      - name: Install dac-peq-manager
        run: |
          pip install -e dac-peq-manager/

      - name: Run test suite
        run: |
          pytest dac-peq-manager/tests -v

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (libudev, libusb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo workspace tests
        working-directory: dac-peq-manager
        run: cargo test --workspace

      - name: Build CLI release binary
        working-directory: dac-peq-manager
        run: cargo build --release -p dac-peq-cli
